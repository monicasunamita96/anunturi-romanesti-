<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anunțuri Românești</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f3f3;
color: #222;
}

header {
background: linear-gradient(135deg, #ff6a00, #ff8c00);
color: white;
text-align: center;
padding: 30px 15px;
}

header h1 {
margin: 0;
font-size: 32px;
}

header p {
margin: 10px 0 0;
font-size: 17px;
}

.container {
max-width: 900px;
margin: 25px auto;
padding: 0 15px;
}

.search-box,
.form-box {
background: white;
padding: 22px;
border-radius: 15px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
margin-bottom: 25px;
}

.search-box h2,
.form-box h2 {
margin-top: 0;
}

input,
select,
textarea {
width: 100%;
padding: 13px;
margin: 8px 0 15px;
border: 1px solid #ccc;
border-radius: 9px;
font-size: 16px;
}

textarea {
min-height: 100px;
resize: vertical;
}

button {
border: none;
border-radius: 9px;
padding: 13px 20px;
font-size: 16px;
cursor: pointer;
}

.add-button {
background: #ff6a00;
color: white;
width: 100%;
font-weight: bold;
margin-bottom: 20px;
}

.publish-button {
background: #159447;
color: white;
width: 100%;
font-weight: bold;
}

.cancel-button {
background: #777;
color: white;
width: 100%;
margin-top: 8px;
}

.hidden {
display: none;
}

.anunt {
background: white;
padding: 20px;
border-radius: 15px;
margin-bottom: 15px;
box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.anunt h3 {
margin-top: 0;
font-size: 22px;
}

.categorie {
color: #777;
font-size: 14px;
}

.pret {
color: #e65300;
font-size: 20px;
font-weight: bold;
margin: 10px 0;
}

.contact {
margin-top: 12px;
padding: 10px;
background: #f5f5f5;
border-radius: 8px;
}

.empty {
text-align: center;
color: #777;
padding: 30px;
}

footer {
text-align: center;
padding: 30px;
color: #777;
}

@media (max-width: 600px) {
header h1 {
font-size: 25px;
}

.container {
padding: 0 10px;
}
}
</style>
</head>

<body>

<header>
<h1>📢 Anunțuri Românești</h1>
<p>Cumpără și vinde simplu și rapid</p>
</header>

<div class="container">

<button class="add-button" onclick="afiseazaFormular()">
➕ Adaugă anunț
</button>

<div id="formular" class="form-box hidden">
<h2>📝 Adaugă un anunț</h2>

<label>Titlul anunțului</label>
<input id="titlu" type="text" placeholder="Ex: iPhone 13">

<label>Categorie</label>
<select id="categorie">
<option value="Electronice">📱 Electronice</option>
<option value="Auto">🚗 Auto</option>
<option value="Imobiliare">🏠 Imobiliare</option>
<option value="Locuri de muncă">💼 Locuri de muncă</option>
<option value="Casă și grădină">🏡 Casă și grădină</option>
<option value="Haine">👕 Haine</option>
<option value="Altele">📦 Altele</option>
</select>

<label>Preț</label>
<input id="pret" type="number" placeholder="Ex: 350">

<label>Descriere</label>
<textarea id="descriere" placeholder="Scrie câteva detalii despre produs..."></textarea>

<label>Telefon / Contact</label>
<input id="contact" type="text" placeholder="Ex: 07xxxxxxxx">

<button class="publish-button" onclick="adaugaAnunt()">
✅ Publică anunțul
</button>

<button class="cancel-button" onclick="ascundeFormular()">
Anulează
</button>
</div>

<div class="search-box">
<h2>🔎 Caută un anunț</h2>

<input
id="cautare"
type="text"
placeholder="Ce cauți?"
oninput="afiseazaAnunturi()"
>

<select id="filtru" onchange="afiseazaAnunturi()">
<option value="Toate">Toate categoriile</option>
<option value="Electronice">📱 Electronice</option>
<option value="Auto">🚗 Auto</option>
<option value="Imobiliare">🏠 Imobiliare</option>
<option value="Locuri de muncă">💼 Locuri de muncă</option>
<option value="Casă și grădină">🏡 Casă și grădină</option>
<option value="Haine">👕 Haine</option>
<option value="Altele">📦 Altele</option>
</select>
</div>

<div id="listaAnunturi"></div>

</div>

<footer>
© 2026 Anunțuri Românești
</footer>

<script>

let anunturi = JSON.parse(localStorage.getItem("anunturiRomanesti")) || [
{
titlu: "iPhone 13",
categorie: "Electronice",
pret: "350",
descriere: "Telefon în stare foarte bună, funcționează perfect.",
contact: "Contactează vânzătorul"
},
{
titlu: "Volkswagen Golf",
categorie: "Auto",
pret: "4.500",
descriere: "Mașină îngrijită, stare bună.",
contact: "Contactează vânzătorul"
}
];

function salveaza() {
localStorage.setItem(
"anunturiRomanesti",
JSON.stringify(anunturi)
);
}

function afiseazaFormular() {
document.getElementById("formular").classList.remove("hidden");
window.scrollTo({
top: 0,
behavior: "smooth"
});
}

function ascundeFormular() {
document.getElementById("formular").classList.add("hidden");
}

function adaugaAnunt() {

const titlu = document.getElementById("titlu").value.trim();
const categorie = document.getElementById("categorie").value;
const pret = document.getElementById("pret").value.trim();
const descriere = document.getElementById("descriere").value.trim();
const contact = document.getElementById("contact").value.trim();

if (!titlu || !pret || !descriere || !contact) {
alert("Te rog completează toate câmpurile.");
return;
}

const anuntNou = {
titlu: titlu,
categorie: categorie,
pret: pret,
descriere: descriere,
contact: contact
};

anunturi.unshift(anuntNou);

salveaza();

document.getElementById("titlu").value = "";
document.getElementById("pret").value = "";
document.getElementById("descriere").value = "";
document.getElementById("contact").value = "";

ascundeFormular();
afiseazaAnunturi();

alert("✅ Anunțul a fost adăugat!");
}

function afiseazaAnunturi() {

const lista = document.getElementById("listaAnunturi");

const cautare =
document.getElementById("cautare").value.toLowerCase();

const filtru =
document.getElementById("filtru").value;

const rezultate = anunturi.filter(anunt => {

const text =
(
anunt.titlu +
" " +
anunt.descriere +
" " +
anunt.categorie
).toLowerCase();

const sePotrivesteCautarea =
text.includes(cautare);

const sePotrivesteCategoria =
filtru === "Toate" ||
anunt.categorie === filtru;

return (
sePotrivesteCautarea &&
sePotrivesteCategoria
);
});

lista.innerHTML = "";

if (rezultate.length === 0) {
lista.innerHTML =
'<div class="empty">😕 Nu am găsit niciun anunț.</div>';
return;
}

rezultate.forEach(anunt => {

const div = document.createElement("div");

div.className = "anunt";

div.innerHTML = `
<div class="categorie">
${anunt.categorie}
</div>

<h3>${anunt.titlu}</h3>

<div class="pret">
${anunt.pret} lei
</div>

<p>
${anunt.descriere}
</p>

<div class="contact">
📞 ${anunt.contact}
</div>
`;

lista.appendChild(div);
});
}

afiseazaAnunturi();

</script>

</body>
</html>
